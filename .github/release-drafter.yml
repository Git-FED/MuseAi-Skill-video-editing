name-template: "v$NEXT_PATCH_VERSION"
tag-template: "v$NEXT_PATCH_VERSION"
categories:
  - title: "🚀 Features"
    labels: ["feature", "enhancement"]
  - title: "🐛 Fixes"
    labels: ["bug", "fix"]
  - title: "🔐 Security"
    labels: ["security"]
  - title: "🧰 Maintenance"
    labels: ["chore", "dependencies", "ci"]
change-template: "- $TITLE (#$NUMBER) @$AUTHOR"
template: |
  ## What's changed
  $CHANGES

  **Full diff**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$NEXT_PATCH_VERSION
